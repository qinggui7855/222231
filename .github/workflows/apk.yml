name: build-apk-v2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls -1 "$SDK" || true
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKM" ]; then
            echo "runner 上没有 sdkmanager，下载 cmdline-tools"
            curl -sSLo /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/cmdl "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline.zip -d /tmp/cmdl
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdl/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=$SDKM"
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -n 20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: star-farmer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
